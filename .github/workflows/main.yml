name: Build Ecstasy Kernel with Modules

on:
  workflow_dispatch: 

jobs:
  build-kernel:
    name: Build Kernel & Modules
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies & pahole
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves libelf-dev
          


    
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
        
          kernel-url: https://github.com/0xUnbound/kernel_common-android13-5.15-lts
          kernel-branch: r34
          
       
          config: gki_defconfig
          arch: arm64
          
        
          aosp-clang: false
          clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          android-version: 13
          aosp-gcc: false
          extra-make-args: LLVM=1 LLVM_IAS=1 modules

       
          anykernel3: false

          name: Prepare Modules Artifact
          run: |
           mkdir -p out/modules_export
           find . -name "*.ko" -exec cp {} out/modules_export/ \;
           echo "Скомпилированные модули:"
           ls -la out/modules_export/

      # 4. Выгружаем чистый архив с модулями
      - name: Upload RT3070 Modules
        uses: actions/upload-artifact@v4
        with:
          name: rt3070_modules_only
          path: out/modules_export/
